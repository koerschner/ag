<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101114">
<title>ag board</title>
<style>
:root{--bg:#101114;--col:#17191e;--card:#1f2228;--card2:#262a31;--line:#2e333b;--fg:#e7e9ee;--dim:#8b919c;--red:#ff3b3b;--redbg:#3a1518;--green:#3ecf8e;--amber:#f5b33b;--blue:#5aa2ff;--violet:#b18cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.6rem .9rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:15px;margin:0 .4rem 0 0;font-weight:650;letter-spacing:.01em}
.counts{display:flex;gap:.35rem;margin-right:auto}
.pill{padding:.12rem .5rem;border-radius:99px;background:var(--card);color:var(--dim);font-size:12px;white-space:nowrap}
.pill b{color:var(--fg);font-weight:600}
.pill.red b{color:var(--red)}
.seg{display:flex;background:var(--card);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:.28rem .7rem;border-radius:6px;color:var(--dim);cursor:pointer}
.seg button.on{background:var(--card2);color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--card);padding:.28rem .7rem;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--card2)}
.btn.on{border-color:var(--red);color:var(--red)}
#q{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.28rem .6rem;width:14rem;max-width:40vw}
#board{display:flex;gap:.7rem;padding:.8rem;overflow-x:auto;height:calc(100% - 52px);align-items:flex-start}
.col{flex:0 0 19rem;background:var(--col);border-radius:12px;display:flex;flex-direction:column;max-height:100%}
.col h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0;padding:.65rem .8rem .45rem;display:flex;justify-content:space-between}
.col .cards{overflow-y:auto;padding:0 .5rem .6rem;display:flex;flex-direction:column;gap:.45rem;min-height:3rem}
.col.drop{outline:2px dashed var(--blue);outline-offset:-3px}
.card{background:var(--card);border-radius:9px;padding:.55rem .65rem .6rem .75rem;cursor:pointer;position:relative;border:1px solid transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card:hover{background:var(--card2)}
.card::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--dim)}
.card[data-s=working]::before{background:var(--blue)}
.card[data-s=blocked]::before{background:var(--amber)}
.card[data-s=done]::before,.card[data-s=idle]::before{background:var(--green)}
.card.resolved{opacity:.6}
.card .t{font-weight:600;display:flex;gap:.35rem;align-items:baseline}
.card .t span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--violet);flex:0 0 8px;align-self:center}
.card .m{font-size:12px;color:var(--dim);margin-top:.1rem;display:flex;gap:.4rem;flex-wrap:wrap}
.card .x{font-size:12.5px;color:#c3c7cf;margin-top:.3rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.card .x.w{color:var(--dim);font-style:italic}
.card.red{background:var(--redbg);border-color:var(--red)}
.card.red::before{background:var(--red)}
.card.throb{animation:throb 1.25s ease-in-out infinite}
@keyframes throb{0%,100%{box-shadow:0 0 0 0 rgba(255,59,59,.0);transform:scale(1)}50%{box-shadow:0 0 0 5px rgba(255,59,59,.45),0 0 22px 4px rgba(255,59,59,.55);transform:scale(1.025)}}
@media (prefers-reduced-motion:reduce){.card.throb{animation:throbfade 1.4s ease-in-out infinite}@keyframes throbfade{50%{background:#5a1c20}}}
.card.focused{outline:1px solid #555}
.card.dragging{opacity:.4}
.empty{color:var(--dim);font-size:12px;padding:.4rem .3rem}
/* drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(46rem,100%);background:#15171b;border-left:1px solid var(--line);transform:translateX(100%);transition:transform .18s ease;z-index:20;display:flex;flex-direction:column}
#drawer.open{transform:none}
#dh{padding:.8rem 1rem;border-bottom:1px solid var(--line)}
#dh .top{display:flex;gap:.5rem;align-items:center}
#dh h3{margin:0;font-size:16px;flex:1}
#dh .m{color:var(--dim);font-size:12px;margin-top:.2rem}
#dh .acts{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
#tx{flex:1;overflow-y:auto;padding:1rem}
.msg{margin:0 0 .9rem}
.msg .who{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:.2rem}
.msg .body{white-space:pre-wrap;word-break:break-word;font-size:13.5px}
.msg.user .body{background:var(--card);padding:.5rem .65rem;border-radius:8px}
.msg code,.msg pre{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace}
.msg pre{background:#0c0d10;padding:.5rem;border-radius:6px;overflow-x:auto;white-space:pre}
#reply{border-top:1px solid var(--line);padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;align-items:flex-end}
#reply textarea{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem;min-height:2.6rem;max-height:30vh;resize:vertical}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;display:none}
#scrim.open{display:block}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#2a2e36;padding:.45rem .9rem;border-radius:8px;display:none;z-index:30}
dialog{background:#15171b;color:var(--fg);border:1px solid var(--line);border-radius:12px;width:min(26rem,92vw)}
dialog input{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.3rem .5rem;flex:1}
dialog .row{display:flex;gap:.4rem;margin:.35rem 0}
.hint{color:var(--dim);font-size:12px;padding:0 .9rem .6rem}
@media (max-width:700px){#board{flex-direction:column;height:auto;overflow-x:visible}.col{flex:none;width:100%}#q{width:100%;max-width:none;order:9}header .counts{width:100%}}
</style>
</head>
<body>
<header>
  <h1>ag board</h1>
  <div class="counts" id="counts"></div>
  <div class="seg" id="views">
    <button data-v="state">State</button><button data-v="lists">Lists</button><button data-v="ws">Workspaces</button>
  </div>
  <button class="btn" id="redonly" title="Show only red cards">🔴 only</button>
  <button class="btn" id="editlists">Lists…</button>
  <input id="q" placeholder="Filter  ( / )" autocomplete="off">
</header>
<div class="hint" id="hint">Shift+click (or long-press) a card to make it 🔴 top priority. Red cards throb and text you when they're ready. Drag cards between lists in the Lists view.</div>
<main id="board"></main>

<div id="scrim"></div>
<aside id="drawer" aria-hidden="true">
  <div id="dh">
    <div class="top"><h3 id="dt"></h3><button class="btn" id="dclose" aria-label="Close">✕</button></div>
    <div class="m" id="dm"></div>
    <div class="acts">
      <button class="btn" id="dred">🔴 Red</button>
      <button class="btn" id="dfocus">Open in Herdr</button>
      <button class="btn" id="dunread">Mark unread</button>
      <select class="btn" id="dlist"></select>
      <button class="btn" id="dkill">Close tab</button>
    </div>
  </div>
  <div id="tx"></div>
  <form id="reply"><textarea id="rt" placeholder="Reply to this agent  (⌘↩ to send)"></textarea><button class="btn">Send</button></form>
</aside>
<dialog id="ldlg"><form method="dialog">
  <h3 style="margin:.2rem 0 .6rem">Lists</h3>
  <div id="lrows"></div>
  <div class="row"><button type="button" class="btn" id="ladd">+ Add list</button></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel">Cancel</button><button class="btn" id="lsave" value="save">Save</button></div>
</form></dialog>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
let B = { cards: [], lists: [], workspaces: [] };
let view = localStorage.view || "state";
let redOnly = localStorage.redOnly === "1";
let openTab = null;
let throbbing = new Set();
let lastTxKey = "";

// ---------- data ----------
function connect() {
  const es = new EventSource("/events");
  es.onmessage = (e) => { B = JSON.parse(e.data); onData(); };
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}
async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!j.ok) toast(j.error || "Failed");
  return j.ok;
}

// ---------- helpers ----------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function ago(t) {
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return "now";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "d";
}
const STATUS = { working: "working", blocked: "blocked", done: "done", idle: "idle", unknown: "?" };
const shortModel = (m) => (m || "").split("/").pop().replace(/^claude-/, "").replace(/-(\d)-(\d)$/, " $1.$2");
function toast(t) { const el = $("#toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => (el.style.display = "none"), 2600); }
function beep() {
  try {
    const a = beep.ctx || (beep.ctx = new AudioContext());
    [880, 1175].forEach((f, i) => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = f; o.connect(g); g.connect(a.destination); const t = a.currentTime + i * 0.16; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14); o.start(t); o.stop(t + 0.15); });
  } catch {}
}
// Card preview: the answer's last real paragraph (skipping DONE / LOC footer lines), which is usually the ask.
function lastPara(t) {
  const paras = String(t || "").replace(/(\n\s*(DONE|LOC [^\n]*))+\s*$/g, "").trim().split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
  let p = paras.pop() || "";
  if (p.length < 60 && paras.length) p = paras.pop() + "\n" + p;
  return p.slice(0, 400);
}
const rank = (c) => (c.red ? 0 : 4) + (c.throb ? 0 : 1) + (c.needsYou ? 0 : 2);
const sortCards = (a) => a.sort((x, y) => rank(x) - rank(y) || y.statusSince - x.statusSince);

// ---------- render ----------
function columns(cards) {
  if (view === "lists") {
    const cols = [{ id: "", name: "Unsorted" }, ...B.lists].map((l) => ({ key: l.id, name: l.name, drop: true, cards: [] }));
    const by = Object.fromEntries(cols.map((c) => [c.key, c]));
    for (const c of cards) (by[c.list || ""] || by[""]).cards.push(c);
    return cols;
  }
  if (view === "ws") {
    const cols = B.workspaces.map((w) => ({ key: w.id, name: w.label, cards: [] }));
    const by = Object.fromEntries(cols.map((c) => [c.key, c]));
    for (const c of cards) by[c.workspace]?.cards.push(c);
    return cols.filter((c) => c.cards.length);
  }
  const cols = [
    { key: "needs", name: "Needs you", cards: [] },
    { key: "working", name: "Working", cards: [] },
    { key: "parked", name: "Parked", cards: [] },
    { key: "resolved", name: "Resolved (DONE)", cards: [] },
  ];
  for (const c of cards) cols[c.status === "working" ? 1 : c.resolved ? 3 : c.needsYou ? 0 : 2].cards.push(c);
  return cols;
}
function cardHtml(c) {
  const working = c.status === "working";
  const snip = working ? (c.lastUser ? "▶ " + c.lastUser.text.slice(0, 400) : "") : lastPara(c.lastAssistant?.text || c.first);
  const cls = ["card", c.red && "red", c.throb && "throb", c.resolved && "resolved", c.focused && "focused"].filter(Boolean).join(" ");
  return `<div class="${cls}" data-tab="${esc(c.tab)}" data-s="${esc(c.status)}" draggable="${view === "lists"}">
    <div class="t">${c.needsYou ? '<i class="dot" title="New since you last looked"></i>' : ""}<span>${esc(c.title)}</span></div>
    <div class="m"><span>${esc(view === "ws" ? "" : c.workspaceLabel)}</span><span>${STATUS[c.status] || c.status} ${ago(c.statusSince)}</span>${c.model ? `<span>${esc(shortModel(c.model))}</span>` : ""}</div>
    ${snip ? `<div class="x${working ? " w" : ""}">${esc(snip)}</div>` : ""}
  </div>`;
}
function render() {
  const q = $("#q").value.trim().toLowerCase();
  let cards = B.cards.filter((c) => !redOnly || c.red);
  if (q) cards = cards.filter((c) => [c.title, c.workspaceLabel, c.lastAssistant?.text, c.lastUser?.text, c.first].join(" ").toLowerCase().includes(q));
  const html = columns(cards).map((col) => `<section class="col" data-key="${esc(col.key)}" data-drop="${col.drop ? 1 : ""}">
      <h2><span>${esc(col.name)}</span><span>${col.cards.length}</span></h2>
      <div class="cards">${sortCards(col.cards).map(cardHtml).join("") || '<div class="empty">—</div>'}</div></section>`).join("");
  $("#board").innerHTML = html;
  const n = (f) => B.cards.filter(f).length;
  const needs = n((c) => c.needsYou);
  $("#counts").innerHTML = `<span class="pill red">🔴 <b>${n((c) => c.red)}</b></span><span class="pill">needs you <b>${needs}</b></span><span class="pill">working <b>${n((c) => c.status === "working")}</b></span><span class="pill">total <b>${B.cards.length}</b></span>`;
  document.title = (needs ? `(${needs}) ` : "") + "ag board";
  document.querySelectorAll("#views button").forEach((b) => b.classList.toggle("on", b.dataset.v === view));
  $("#redonly").classList.toggle("on", redOnly);
}
function onData() {
  const now = new Set(B.cards.filter((c) => c.throb).map((c) => c.tab));
  if ([...now].some((t) => !throbbing.has(t))) beep();
  throbbing = now;
  render();
  if (openTab) renderDrawer();
}

// ---------- drawer ----------
function card(tab) { return B.cards.find((c) => c.tab === tab); }
function mdLite(s) {
  return esc(s).replace(/```[\w-]*\n([\s\S]*?)```/g, (_, c) => `<pre>${c}</pre>`).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
}
async function loadTranscript(c) {
  const msgs = await (await fetch("/api/transcript?tab=" + encodeURIComponent(c.tab))).json();
  const tx = $("#tx");
  const atBottom = tx.scrollHeight - tx.scrollTop - tx.clientHeight < 80;
  tx.innerHTML = msgs.map((m) => `<div class="msg ${m.role}"><div class="who">${m.role === "user" ? "Nathan / prompt" : "agent"} · ${ago(m.ts)} ago</div><div class="body">${mdLite(m.text)}</div></div>`).join("") || '<div class="empty">No messages yet.</div>';
  if (atBottom || !renderDrawer.loaded) tx.scrollTop = tx.scrollHeight;
  renderDrawer.loaded = true;
}
function renderDrawer() {
  const c = card(openTab);
  if (!c) { closeDrawer(); return; }
  $("#dt").textContent = (c.red ? "🔴 " : "") + c.title;
  $("#dm").textContent = `${c.workspaceLabel} · ${c.status} ${ago(c.statusSince)} · ${shortModel(c.model)} · ${c.tab}`;
  $("#dred").classList.toggle("on", c.red);
  $("#dlist").innerHTML = [{ id: "", name: "No list" }, ...B.lists].map((l) => `<option value="${esc(l.id)}" ${l.id === (c.list || "") ? "selected" : ""}>${esc(l.name)}</option>`).join("");
  const key = c.tab + (c.lastAssistant?.ts || 0) + (c.lastUser?.ts || 0) + c.status;
  if (key !== lastTxKey) { lastTxKey = key; loadTranscript(c); }
  if (c.needsYou && c.status !== "blocked") api("/api/card", { tab: c.tab, seen: true });
}
function openDrawer(tab) {
  openTab = tab; lastTxKey = ""; renderDrawer.loaded = false;
  history.replaceState(null, "", "#" + tab);
  $("#drawer").classList.add("open"); $("#scrim").classList.add("open"); $("#drawer").setAttribute("aria-hidden", "false");
  const c = card(tab);
  if (c) api("/api/card", { tab, seen: true });
  renderDrawer();
  if (matchMedia("(pointer:fine)").matches) $("#rt").focus();
}
function closeDrawer() {
  openTab = null;
  history.replaceState(null, "", location.pathname);
  $("#drawer").classList.remove("open"); $("#scrim").classList.remove("open"); $("#drawer").setAttribute("aria-hidden", "true");
}
const toggleRed = (tab) => { const c = card(tab); if (c) { c.red = !c.red; render(); api("/api/card", { tab, red: c.red }); } };

// ---------- events ----------
let pressTimer = null, longPressed = false;
$("#board").addEventListener("click", (e) => {
  const el = e.target.closest(".card"); if (!el) return;
  if (longPressed) { longPressed = false; return; }
  if (e.shiftKey) { e.preventDefault(); toggleRed(el.dataset.tab); return; }
  openDrawer(el.dataset.tab);
});
$("#board").addEventListener("mousedown", (e) => { if (e.shiftKey) e.preventDefault(); }); // no text selection on shift+click
$("#board").addEventListener("touchstart", (e) => {
  const el = e.target.closest(".card"); if (!el) return;
  longPressed = false;
  pressTimer = setTimeout(() => { longPressed = true; navigator.vibrate?.(30); toggleRed(el.dataset.tab); }, 550);
}, { passive: true });
["touchend", "touchmove", "touchcancel"].forEach((ev) => $("#board").addEventListener(ev, () => clearTimeout(pressTimer), { passive: true }));
// drag between lists
$("#board").addEventListener("dragstart", (e) => { const el = e.target.closest(".card"); if (!el) return; e.dataTransfer.setData("text/plain", el.dataset.tab); el.classList.add("dragging"); });
$("#board").addEventListener("dragend", (e) => e.target.closest?.(".card")?.classList.remove("dragging"));
$("#board").addEventListener("dragover", (e) => { const col = e.target.closest(".col[data-drop='1']"); if (!col) return; e.preventDefault(); document.querySelectorAll(".col.drop").forEach((c) => c !== col && c.classList.remove("drop")); col.classList.add("drop"); });
$("#board").addEventListener("dragleave", (e) => { const col = e.target.closest(".col"); if (col && !col.contains(e.relatedTarget)) col.classList.remove("drop"); });
$("#board").addEventListener("drop", (e) => {
  const col = e.target.closest(".col[data-drop='1']"); if (!col) return;
  e.preventDefault(); col.classList.remove("drop");
  const tab = e.dataTransfer.getData("text/plain"); const c = card(tab); if (!c) return;
  c.list = col.dataset.key || undefined; render(); api("/api/card", { tab, list: col.dataset.key });
});
$("#views").addEventListener("click", (e) => { const v = e.target.dataset.v; if (v) { view = localStorage.view = v; render(); } });
$("#redonly").onclick = () => { redOnly = !redOnly; localStorage.redOnly = redOnly ? "1" : "0"; render(); };
$("#q").addEventListener("input", render);
$("#scrim").onclick = closeDrawer;
$("#dclose").onclick = closeDrawer;
$("#dred").onclick = () => toggleRed(openTab);
$("#dfocus").onclick = async () => { if (await api("/api/focus", { tab: openTab })) toast("Focused in Herdr"); };
$("#dunread").onclick = async () => { const t = openTab; closeDrawer(); await api("/api/card", { tab: t, seen: false }); };
$("#dlist").onchange = (e) => api("/api/card", { tab: openTab, list: e.target.value });
$("#dkill").onclick = async () => { const c = card(openTab); if (c && confirm(`Close the Herdr tab "${c.title}"? The agent session ends (its Pi session file stays).`)) { if (await api("/api/close", { tab: c.tab })) closeDrawer(); } };
$("#reply").onsubmit = async (e) => {
  e.preventDefault(); const text = $("#rt").value.trim(); if (!text || !openTab) return;
  if (await api("/api/prompt", { tab: openTab, text })) { $("#rt").value = ""; toast("Sent"); }
};
$("#rt").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("#reply").requestSubmit(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (openTab) closeDrawer(); else $("#q").blur(); }
  if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); }
});
// lists editor
function listRow(l) { return `<div class="row" data-id="${esc(l.id)}"><input value="${esc(l.name)}"><button type="button" class="btn" data-del>✕</button></div>`; }
$("#editlists").onclick = () => { $("#lrows").innerHTML = B.lists.map(listRow).join(""); $("#ldlg").showModal(); };
$("#ladd").onclick = () => $("#lrows").insertAdjacentHTML("beforeend", listRow({ id: "l" + Date.now().toString(36), name: "" }));
$("#lrows").addEventListener("click", (e) => { if (e.target.dataset.del !== undefined) e.target.closest(".row").remove(); });
$("#ldlg").addEventListener("close", () => {
  if ($("#ldlg").returnValue !== "save") return;
  const lists = [...document.querySelectorAll("#lrows .row")].map((r) => ({ id: r.dataset.id, name: r.querySelector("input").value.trim() })).filter((l) => l.name);
  api("/api/lists", { lists });
});
setInterval(render, 30_000); // keep "5m ago" fresh
connect();
if (location.hash.length > 1) { const t = decodeURIComponent(location.hash.slice(1)); const wait = setInterval(() => { if (card(t)) { clearInterval(wait); openDrawer(t); } }, 200); setTimeout(() => clearInterval(wait), 5000); }
</script>
</body>
</html>
