# TrueFoundry gateway setup (based on colleague's bundle). Model slugs must match
# model-catalogs/truefoundry-codex.json; TFY's /models endpoint isn't in Codex's
# catalog format, so the local catalog is what makes the picker/tools work.
# Profiles: codex --profile astra|sol|terra|luna|grok
# Note: catalog's gpt-6-astra minimal_client_version was lowered 0.153.0 -> 0.144.0
# so it shows in the picker on the bundled codex 0.147.x (works fine in practice).
model_provider = "tfy"
model = "gpt-6-astra"
model_reasoning_effort = "high"
model_catalog_json = "/Users/nathan/.codex/model-catalogs/truefoundry-codex.json"

notify = ["/Users/nathan/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

