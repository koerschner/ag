<script>
// Theme: System (follows macOS) / Light / Dark, chosen in the profile menu (localStorage agchat.theme). Resolved to a
// class on <html> before first paint so there's no flash.
(function () {
  var mq = matchMedia("(prefers-color-scheme: light)");
  window.applyTheme = function () {
    var pref = "system";
    try { pref = localStorage.getItem("agchat.theme") || "system"; } catch (e) {}
    var light = pref === "light" || (pref === "system" && mq.matches);
    document.documentElement.classList.toggle("light", light);
    var m = document.getElementById("themeColor");
    if (m) m.setAttribute("content", light ? "#f9f9f9" : "#171717");
  };
  mq.addEventListener("change", function () { window.applyTheme(); });
  window.applyTheme();
})();
</script>
