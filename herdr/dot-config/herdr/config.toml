onboarding = false

[ui]
# Hammerspoon matches this prefix to forward Cmd-T/W/D shortcuts into herdr.
window_title = "herdr: {workspace}"

[ui.toast]
delivery = "terminal"

[theme]
name = "gruvbox"
auto_switch = false

[keys]
# shift+h/j/k/l swaps moved to shift+arrows so L is free.
swap_pane_left = "prefix+shift+left"
swap_pane_down = "prefix+shift+down"
swap_pane_up = "prefix+shift+up"
swap_pane_right = "prefix+shift+right"
# Direct Cmd bindings for terminals that forward Cmd, e.g. Moshi on iPhone/iPad
# (the Mac gets the same keys via Hammerspoon's prefix chords). Moshi keeps
# Cmd+N/W/O/K/V/1-9 for itself, so those can't reach herdr there.
split_vertical = ["prefix+v", "cmd+d"]
split_horizontal = ["prefix+minus", "cmd+shift+d"]
close_pane = ["prefix+x", "cmd+w"]
switch_tab = ["prefix+1..9", "cmd+1..9"]

# tmux-ish find-window: prefix+f fuzzy-searches every tab by space name, tab name,
# and contents (pi transcripts / scrollback); type, Enter jumps to the tab.
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "/usr/bin/python3 $HOME/.local/bin/herdr-find"
description = "find tab"
width = "80%"
height = "70%"

# tmux `prefix+L` (switch-client -l): toggle to the last used space.
[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "$HOME/.local/bin/herdr-nav last-space"
description = "last space"

# Cmd+T / Cmd+[ / Cmd+] in Hammerspoon send these chords (not alt+arrows:
# Ghostty turns those into esc+b/f before herdr sees them), so the helper
# scripts run on whichever host owns the session (also through `ag`).
[[keys.command]]
key = ["prefix+t", "cmd+t"]
type = "shell"
command = "/usr/bin/python3 $HOME/.local/bin/herdr-new-pi-tab"
description = "new tab with pi"

# Cmd+Shift+T: reopen the last closed pane (herdr-nav daemon remembers it).
[[keys.command]]
key = ["prefix+u", "cmd+shift+t"]
type = "shell"
command = "/usr/bin/python3 $HOME/.local/bin/herdr-nav reopen"
description = "reopen closed pane"

[[keys.command]]
key = ["prefix+[", "cmd+["]
type = "shell"
command = "/usr/bin/python3 $HOME/.local/bin/herdr-nav back"
description = "focus history back"

[[keys.command]]
key = ["prefix+]", "cmd+]"]
type = "shell"
command = "/usr/bin/python3 $HOME/.local/bin/herdr-nav forward"
description = "focus history forward"
