<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src file: 'unsafe-inline'">
<title>ag-dash</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f7f8; --text: #1d1d1f; --muted: #86868b; --line: rgba(0, 0, 0, .08); --accent: #0a84ff; --accent-text: #fff; --key: rgba(0, 0, 0, .06); --bad: #ff453a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #212121; --text: #f5f5f7; --muted: #98989d; --line: rgba(255, 255, 255, .1); --key: rgba(255, 255, 255, .09); } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: var(--text); -webkit-user-select: none; display: flex; flex-direction: column; }
  .bar { height: 52px; flex: none; -webkit-app-region: drag; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 32px 80px; }
  .card { max-width: 440px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .logo { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #2b2b2e, #000); color: #fff; font: 700 24px/56px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; letter-spacing: -.5px; margin-bottom: 8px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -.2px; }
  p { margin: 0; color: var(--muted); }
  .actions { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
  button { font: 500 15px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; border: 0; border-radius: 10px; padding: 9px 18px; cursor: pointer; color: var(--text); background: var(--key); }
  button.primary { background: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: .55; cursor: default; }
  .err { color: var(--bad); font-size: 13px; min-height: 20px; -webkit-user-select: text; }
  .foot { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; justify-content: center; }
  .dot { width: 7px; height: 7px; border-radius: 4px; background: var(--muted); animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div class="bar"></div>
<main>
  <div class="card">
    <div class="logo">Ag</div>
    <h1 id="title">Looking for ag-dash…</h1>
    <p id="body">ag-dash runs on ag-engine and is reached over Tailscale.</p>
    <div class="actions" id="actions"></div>
    <div class="err" id="err"></div>
    <div class="foot"><span class="dot"></span><span id="foot">Checking…</span></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const api = window.agDashOffline;
// What each state says and offers. fix: an ipc fix (offline.js) or "retry".
const STATES = {
  probing: { title: "Looking for ag-dash…", body: "ag-dash runs on ag-engine and is reached over Tailscale." },
  "ts-Stopped": { title: "Tailscale is stopped on this Mac", body: "ag-dash runs on ag-engine and is only reachable over Tailscale. Start it and ag-dash comes back here by itself.", button: "Start Tailscale", fix: "tailscale-up" },
  "ts-NeedsLogin": { title: "Tailscale needs you to sign in", body: "Sign in to Tailscale on this Mac and ag-dash comes back here by itself.", button: "Open Tailscale", fix: "open-tailscale" },
  "ts-Missing": { title: "Tailscale isn't installed on this Mac", body: "ag-dash runs on ag-engine and is only reachable over Tailscale.", button: "Download Tailscale", fix: "download-tailscale" },
  "ts-Starting": { title: "Tailscale is starting…", body: "ag-dash comes back here as soon as it connects." },
  "ts-NoState": { title: "Tailscale isn't running on this Mac", body: "Open Tailscale to connect; ag-dash comes back here by itself.", button: "Open Tailscale", fix: "open-tailscale" },
  "ts-Unknown": { title: "Tailscale isn't running on this Mac", body: "Open Tailscale to connect; ag-dash comes back here by itself.", button: "Open Tailscale", fix: "open-tailscale" },
  "engine-down": { title: "ag-engine isn't answering", body: "Tailscale is up on this Mac, but ag-engine (where ag-dash runs) doesn't respond. It may be rebooting or out of memory; that usually clears within a minute or two. Please don't reboot it from Hetzner unless it stays down for 5+ minutes: a reboot stops every running session mid-turn.", button: "Retry now", fix: "retry" },
  "dash-down": { title: "ag-dash isn't running on ag-engine", body: "ag-engine is reachable, but its ag-dash service isn't answering. It usually comes back on its own.", button: "Retry now", fix: "retry" },
};
let fixing = false;
function render(d) {
  const s = STATES[d.state] || STATES.probing;
  $("title").textContent = d.busy || s.title;
  $("body").textContent = s.body;
  const actions = $("actions");
  actions.replaceChildren();
  if (s.button) {
    const b = document.createElement("button");
    b.textContent = s.button;
    b.className = s.fix === "retry" ? "" : "primary";
    b.disabled = fixing || !!d.busy;
    b.onclick = async () => {
      fixing = true; $("err").textContent = ""; render(d);
      const err = s.fix === "retry" ? await api.retry() : await api.fix(s.fix);
      fixing = false; $("err").textContent = err || ""; render({ ...d, busy: "" });
    };
    actions.append(b);
    if (s.fix !== "retry") {
      const r = document.createElement("button");
      r.textContent = "Retry now";
      r.onclick = () => api.retry();
      actions.append(r);
    }
  }
  $("foot").textContent = d.at ? `Checking every 3 s · last checked ${new Date(d.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" })}` : "Checking…";
}
api.onStatus(render);
api.status().then(render);
</script>
</body>
</html>
