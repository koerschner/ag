# Ag's tmux server (`tmux -L ag`), run by ag-mux (bin/dot-local/bin/ag-mux, docs/ag-mux.md).
# Stowed to ~/.config/ag/ag.tmux.conf; apply changes with `ag-mux server reload-config`.
# Nathan's own ~/.tmux.conf loads first; everything below is what Ag needs on top of it.
source-file -q ~/.tmux.conf

set -g prefix C-b
bind C-b send-prefix

# Every pane starts through ag-mux-shell, which gives it its Ag IDs (AG_* env) before the login shell.
set -g default-command "exec $HOME/.local/bin/ag-mux-shell"
set -g exit-empty off
set -g default-size 200x50
set -g window-size latest
set -g aggressive-resize on
set -g allow-rename off
set -g automatic-rename off
set -g base-index 1
set -g renumber-windows on
set -g allow-passthrough on
set -g mouse on
set -g history-limit 100000
set -g focus-events on
set -g extended-keys on
set -g escape-time 10
set -as terminal-features ",*:hyperlinks"
# Hammerspoon forwards Cmd shortcuts into Ghostty windows whose title starts with "ag:".
set -g set-titles on
set -g set-titles-string "ag: #{@ag_ws_label} › #W"

# Status: line 1 = tabs of this workspace (⚠ blocked, … working, ● finished and unseen); line 2 = workspaces
# (Inbox first; N● = tabs needing you). agd keeps @ag_glyph and @ag_ws_line up to date. Click to switch.
set -g status 2
set -g status-interval 5
set -g status-left "#[bold] #{@ag_ws_label} #[default]"
set -g status-left-length 40
set -g status-right "%H:%M "
set -g window-status-format " #I #W#{@ag_glyph} "
set -g window-status-current-format "#[reverse] #I #W#{@ag_glyph} #[noreverse]"
set -g status-format[1] "#[align=left]#{E:@ag_ws_line}"
bind -n MouseDown1Status if -F "#{m:$*,#{mouse_status_range}}" "switch-client -t '#{mouse_status_range}'" "select-window -t ="

# Shortcuts (canonical list: shortcuts.json beside this file, tmux/SHORTCUTS.md; Hammerspoon sends Cmd+key as prefix+key).
bind t run-shell -b "python3 $HOME/.local/bin/ag-new-pi-tab"
bind x kill-pane
bind u run-shell -b "python3 $HOME/.local/bin/ag-nav reopen"
bind [ run-shell -b "python3 $HOME/.local/bin/ag-nav back"
bind ] run-shell -b "python3 $HOME/.local/bin/ag-nav forward"
bind Escape copy-mode
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind f display-popup -E -w 80% -h 70% "python3 $HOME/.local/bin/ag-tab-find"
bind L switch-client -l
bind s display-popup -E -w 80% -h 70% "$HOME/.local/bin/ag-mux switch --client '#{client_name}'"
