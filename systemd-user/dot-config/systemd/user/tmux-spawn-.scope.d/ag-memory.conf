# Every tmux pane on the session host runs in its own tmux-spawn-<uuid>.scope. Cap each one so a single pane's
# runaway (tsgo/tsgolint/vitest from a big type-check) gets throttled, then OOM-killed inside its own pane,
# instead of exhausting the whole engine and stalling every session (incident 2026-10-03: global OOM, then a reboot).
# MemoryHigh throttles and pushes the pane to swap; MemoryMax is the hard ceiling for the pane's process tree.
[Scope]
MemoryHigh=10G
MemoryMax=14G
