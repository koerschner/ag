id = "nathan.pin-inbox"
name = "Pin Inbox"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Keep the Inbox workspace (GTD inbox) first in the sidebar."
platforms = ["macos", "linux"]

[[startup]]
command = ["sh", "pin.sh"]

[[events]]
on = "workspace.created"
command = ["sh", "pin.sh"]

[[events]]
on = "workspace.renamed"
command = ["sh", "pin.sh"]

[[events]]
on = "workspace.moved"
command = ["sh", "pin.sh"]

[[events]]
on = "workspace.reordered"
command = ["sh", "pin.sh"]
