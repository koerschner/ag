<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b1020; color: #fff; font-family: system-ui, sans-serif; }
  .t { position: absolute; left: 0; right: 0; text-align: center; font-size: 120px; font-weight: 800; opacity: 0; }
  #cap { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; bottom: 44px; font-size: 40px; padding: 10px 24px; border-radius: 16px; background: rgba(0,0,0,.6); }
  #cap .w { opacity: .6 } #cap .w.on { opacity: 1 }
  #dot { position: absolute; width: 80px; height: 80px; border-radius: 50%; background: #ffd41f; left: 920px; top: 700px; transform: scale(0); }
</style></head><body>
  <div class="t" id="a" style="top:380px">Made in code</div>
  <div class="t" id="b" style="top:380px">On the word</div>
  <div class="t" id="c" style="top:380px">Grade. Repeat.</div>
  <div id="dot"></div><div id="cap"></div>
<script src="/lib/gsap.min.js"></script><script src="/lib/ev.js"></script>
<script>
EV.start(() => {
  const tl = (window.tl = gsap.timeline({ paused: true }))
  for (const [id, line] of [['#a', 'one'], ['#b', 'two'], ['#c', 'three']]) {
    tl.fromTo(id, { opacity: 0, scale: 1.4, filter: 'blur(12px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.5, ease: 'power3.out', immediateRender: false }, EV.at(line))
    tl.to(id, { opacity: 0, duration: 0.3 }, EV.end(line) + 0.1)
  }
  tl.to('#dot', { scale: 1, duration: 0.3, ease: 'back.out(3)' }, EV.word('two', 'word'))
  EV.captions(document.querySelector('#cap'))
})
</script></body></html>
